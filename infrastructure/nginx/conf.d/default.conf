# Load balancer cho REST + Socket.IO (media LiveKit KHÔNG đi qua đây — PROJECT_CONTEXT §5)

upstream backend {
    least_conn;                     # ADR-006: kết nối mới vào bản đang ít kết nối nhất, không sticky
    zone backend 64k;               # bắt buộc khi dùng "resolve"
    resolver 127.0.0.11 valid=5s;   # DNS nội bộ Docker: --scale thêm/bớt bản backend thì tự cập nhật, không cần reload
    server backend:3001 resolve;
}

# WebSocket: chuyển tiếp header Upgrade của Socket.IO
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Ghi bản backend nhận request (upstream=IP:port) — dùng để kiểm chia tải, thay tạm instanceId (§17)
log_format upstream '$time_local "$request" $status upstream=$upstream_addr';

server {
    listen 80;
    access_log /var/log/nginx/access.log upstream;

    location / {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
