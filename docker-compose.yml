services:
  mongo:
    image: mongo:7
    container_name: mongo-dev
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 5s
      retries: 5

  livekit:
    image: livekit/livekit-server:v1.13.7
    container_name: livekit-dev
    restart: unless-stopped
    # Key/secret chỉ khai báo ở backend/.env (spec §3.3): đọc env_file rồi ghép thành LIVEKIT_KEYS="key: secret".
    # $$ = ký tự $ thật (không để Compose thay biến)
    env_file:
      - ./backend/.env
    entrypoint: ["/bin/sh", "-c", "LIVEKIT_KEYS=\"$$LIVEKIT_API_KEY: $$LIVEKIT_API_SECRET\" exec /livekit-server --config /etc/livekit.yaml"]
    volumes:
      - ./infrastructure/livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

  # Chạy nhiều bản: docker compose up -d --scale backend=2
  # Không đặt container_name / ports để Compose tạo được nhiều bản; truy cập qua nginx (cổng 3001)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_OPTIONS: "--dns-result-order=ipv4first"
      MONGO_URI: mongodb://mongo:27017/online-group-learning
      REDIS_URL: redis://redis:6379
      LIVEKIT_URL: http://livekit:7880
      # Thí nghiệm E1: đặt off để tắt Socket.IO Redis adapter (mặc định on)
      SOCKET_REDIS_ADAPTER: ${SOCKET_REDIS_ADAPTER:-on}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src

  # Load balancer trước các bản backend (ADR-006: least_conn, không sticky).
  # Giữ cổng 3001 như backend cũ → frontend và webhook LiveKit không phải đổi URL
  nginx:
    image: nginx:1.28.0-alpine
    container_name: nginx-dev
    restart: unless-stopped
    ports:
      - "3001:80"
    volumes:
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on: [backend]

  frontend:
    build: { context: ./frontend }
    container_name: frontend-dev
    ports: ["3000:3000"]
    restart: unless-stopped
    environment:
      WATCHPACK_POLLING: "true"   # Windows: mount không báo file đổi → dò định kỳ để hot reload chạy
    depends_on: [backend]
    volumes:
      - ./frontend/src:/app/src                      # sửa code → tự reload, như backend mount ./backend/src
      - ./backend/src/shared:/backend/src/shared:ro  # alias @shared (ADR-024) trỏ ../backend/src/shared

volumes:
  mongo-data:
  redis-data:
