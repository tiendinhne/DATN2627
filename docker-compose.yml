services:
  mongo:
    image: mongo:7
    container_name: mongo-dev
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 5s
      retries: 5

  livekit:
    image: livekit/livekit-server:v1.13.7
    container_name: livekit-dev
    restart: unless-stopped
    # Key/secret chỉ khai báo ở backend/.env (spec §3.3): đọc env_file rồi ghép thành LIVEKIT_KEYS="key: secret".
    # $$ = ký tự $ thật (không để Compose thay biến)
    env_file:
      - ./backend/.env
    entrypoint: ["/bin/sh", "-c", "LIVEKIT_KEYS=\"$$LIVEKIT_API_KEY: $$LIVEKIT_API_SECRET\" exec /livekit-server --config /etc/livekit.yaml"]
    volumes:
      - ./infrastructure/livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend-dev
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    environment:
      NODE_OPTIONS: "--dns-result-order=ipv4first"
      MONGO_URI: mongodb://mongo:27017/online-group-learning
      REDIS_URL: redis://redis:6379
      LIVEKIT_URL: http://livekit:7880
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src

volumes:
  mongo-data:
  redis-data:
